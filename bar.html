<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED bar</title>
<link rel="stylesheet" href="gauge.css">
<style>
  .inst { place-items: stretch; align-content: center; gap: clamp(8px, 7cqh, 18px); }
  .read { display: flex; align-items: baseline; gap: 0.35em; min-inline-size: 0; }
  .num { font-size: clamp(26px, min(30cqh, 16cqw), 64px); font-weight: 650; line-height: 1; }
  :root[data-state="look"] .num, :root[data-state="broken"] .num { color: var(--ink); text-shadow: 0 0 10px var(--glow); }
  .of { color: var(--muted); font-size: clamp(12px, min(9cqh, 4.6cqw), 17px); }
  .leds { display: flex; gap: clamp(2px, 1.1cqw, 6px); block-size: clamp(16px, 26cqh, 52px); }
  .led { flex: 1; border-radius: 3px; background: var(--dim); }
  .led.on { background: var(--c); box-shadow: 0 0 8px color-mix(in oklch, var(--c) 60%, transparent); }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: clamp(11px, min(7cqh, 3.4cqw), 13px); }
  @media (prefers-reduced-motion: no-preference) {
    .led { transition: background-color 160ms ease-out, box-shadow 160ms ease-out; transition-delay: calc(var(--i) * 45ms); }
  }
</style>
</head>
<body>
<main class="panel">
  <div class="inst">
    <div class="read"><span class="num"></span><span class="of"></span></div>
    <div class="leds" role="img"></div>
    <div class="scale"><span class="lo"></span><span class="hi"></span></div>
  </div>
  <footer class="cap"></footer>
</main>
<script src="gauge.js"></script>
<script>
  const { num, str, judge, state, el, caption, settle, fmt } = G;
  const min = num("min", 0), max = num("max", 100), v = num("value");
  const segs = Math.min(40, Math.max(3, Math.round(num("segments", 12))));
  const s = state(judge(v));
  const look = num("look"), broken = num("broken"), low = str("good", "high") === "low";
  const zoneOf = x => {
    if (low) return x >= broken ? "--broken" : x >= look ? "--look" : "--accent";
    return x <= broken ? "--broken" : x <= look ? "--look" : "--accent";
  };

  document.querySelector(".num").textContent = Number.isFinite(v) ? fmt(v) : "–";
  document.querySelector(".of").textContent = [str("unit"), Number.isFinite(v) ? `of ${fmt(max)}` : "no reading"].filter(Boolean).join(" ");
  document.querySelector(".lo").textContent = fmt(min, 0);
  document.querySelector(".hi").textContent = fmt(max, 0);

  const leds = document.querySelector(".leds");
  leds.setAttribute("aria-label", `${str("label", "Level")}: ${fmt(v)} of ${fmt(max)}`);
  const lit = Number.isFinite(v) ? Math.round(segs * Math.min(1, Math.max(0, (v - min) / ((max - min) || 1)))) : 0;
  const cells = [];
  for (let i = 0; i < segs; i++) {
    const c = el("span", "led");
    const mid = min + (max - min) * (i + 0.5) / segs;
    c.style.setProperty("--c", `var(${zoneOf(mid)})`);
    c.style.setProperty("--i", i);
    leds.append(c);
    cells.push(c);
  }
  settle(() => cells.forEach((c, i) => c.classList.toggle("on", i < lit)));
  caption("Level", s);
</script>
</body>
</html>
