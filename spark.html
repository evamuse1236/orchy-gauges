<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkline</title>
<link rel="stylesheet" href="gauge.css?v=4">
<style>
  .inst { grid-template-rows: auto minmax(0, 1fr); place-items: stretch; gap: clamp(4px, 3cqh, 10px); }
  .read { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5em; }
  .num { font-size: clamp(24px, min(24cqh, 13cqw), 56px); font-weight: 650; line-height: 1; }
  :root[data-state="look"] .num, :root[data-state="broken"] .num { color: var(--ink); text-shadow: 0 0 10px var(--glow); }
  .unit, .delta { color: var(--muted); font-size: clamp(12px, min(9cqh, 4.4cqw), 16px); }
  .plot { position: relative; min-block-size: 0; }
  .plot svg { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; overflow: visible; }
  .line { stroke: var(--ink); stroke-width: 2.2; fill: none; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 3px var(--glow)); }
  .area { fill: color-mix(in oklch, var(--ink) 16%, transparent); }
  .lim { stroke: var(--look); stroke-width: 1; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
  .dot { position: absolute; inline-size: 9px; aspect-ratio: 1; border-radius: 50%; background: var(--ink); box-shadow: 0 0 8px var(--glow); translate: -50% -50%; }
  .axis { position: absolute; inset-inline-end: 0; color: var(--muted); font-size: 11px; line-height: 1; }
  .axis.top { inset-block-start: 0; } .axis.bot { inset-block-end: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .plot svg { transition: clip-path 1200ms cubic-bezier(0.22, 1, 0.36, 1); }
  }
</style>
</head>
<body>
<main class="panel">
  <div class="inst">
    <div class="read"><span class="num"></span><span class="unit"></span><span class="delta"></span></div>
    <div class="plot"></div>
  </div>
  <footer class="cap"></footer>
</main>
<script src="gauge.js?v=4"></script>
<script>
  const { num, str, judge, state, svg, el, caption, settle, fmt } = G;
  const vals = str("values").split(",").map(parseFloat).filter(Number.isFinite).slice(-60);
  const last = vals.at(-1), prev = vals.at(-2);
  const s = state(judge(Number.isFinite(num("value")) ? num("value") : last));
  document.querySelector(".num").textContent = fmt(Number.isFinite(num("value")) ? num("value") : last);
  document.querySelector(".unit").textContent = str("unit");
  if (Number.isFinite(prev)) {
    const d = last - prev;
    document.querySelector(".delta").textContent = d === 0 ? "same as last" : `${d > 0 ? "up" : "down"} ${fmt(Math.abs(d))} from last`;
  }

  const plot = document.querySelector(".plot");
  if (vals.length >= 2) {
    const look = num("look");
    let lo = Math.min(...vals, Number.isFinite(look) ? look : Infinity), hi = Math.max(...vals, Number.isFinite(look) ? look : -Infinity);
    if (Number.isFinite(num("min"))) lo = num("min");
    if (Number.isFinite(num("max"))) hi = num("max");
    if (hi === lo) { hi += 1; lo -= 1; }
    const W = 100, H = 40, pad = 3;
    const x = i => i / (vals.length - 1) * W, y = v => pad + (H - 2 * pad) * (1 - (v - lo) / (hi - lo));
    const pts = vals.map((v, i) => `${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(" ");
    const g = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", role: "img" }, plot);
    g.setAttribute("aria-label", `${str("label", "Trend")}: ${vals.length} readings, latest ${fmt(last)}`);
    svg("polygon", { points: `0,${H} ${pts} ${W},${H}`, class: "area" }, g);
    if (Number.isFinite(look)) svg("line", { x1: 0, x2: W, y1: y(look), y2: y(look), class: "lim" }, g);
    svg("polyline", { points: pts, class: "line" }, g);
    g.style.clipPath = "inset(-10% 100% -10% -10%)";
    const dot = el("span", "dot");
    dot.style.insetInlineStart = "100%";
    dot.style.insetBlockStart = `${y(last) / H * 100}%`;
    plot.append(dot, el("span", "axis top", fmt(hi)), el("span", "axis bot", fmt(lo)));
    settle(() => { g.style.clipPath = "inset(-10% -10% -10% -10%)"; });
  } else {
    plot.append(el("span", "unit", "needs two or more readings"));
  }
  caption("Trend", s);
</script>
</body>
</html>
