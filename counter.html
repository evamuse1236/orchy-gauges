<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odometer</title>
<link rel="stylesheet" href="gauge.css?v=3">
<style>
  .inst { gap: clamp(4px, 4cqh, 12px); }
  .odo {
    --h: min(56cqh, calc(118cqw / (var(--n) * 0.78 + 0.6)));
    display: flex; align-items: center; gap: calc(var(--h) * 0.06);
    font-size: var(--h); line-height: 1; font-weight: 700;
  }
  .drum {
    position: relative;
    inline-size: 0.72em; block-size: 1.18em;
    border-radius: 0.1em;
    background: var(--face);
    box-shadow: inset 0 0 0 1px var(--rim);
    overflow: clip;
  }
  .drum::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(var(--paper), transparent 30%, transparent 70%, var(--paper));
    pointer-events: none;
  }
  .reel { display: flex; flex-direction: column; transform: translateY(calc(var(--d, 0) * -1.18em)); }
  .reel span { block-size: 1.18em; display: grid; place-items: center; color: var(--ink); text-shadow: 0 0 0.12em var(--glow); }
  .sep { color: var(--muted); font-size: 0.6em; align-self: end; padding-block-end: 0.15em; }
  .unit { font-size: clamp(12px, min(10cqh, 5cqw), 18px); color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: no-preference) {
    .reel { transition: transform 1400ms cubic-bezier(0.16, 1, 0.3, 1); transition-delay: calc(var(--i) * 110ms); }
  }
</style>
</head>
<body>
<main class="panel">
  <div class="inst"><div class="odo" role="img"></div><div class="unit"></div></div>
  <footer class="cap"></footer>
</main>
<script src="gauge.js?v=3"></script>
<script>
  const { num, str, judge, state, el, caption, settle, fmt } = G;
  const v = num("value");
  const s = state(judge(v));
  const digits = Math.min(9, Math.max(1, Math.round(num("digits", 0)) || String(Math.round(Math.abs(v)) || 0).length));
  const shown = Number.isFinite(v) ? String(Math.round(Math.abs(v))).padStart(digits, "0").slice(-digits) : "–".repeat(digits);

  const odo = document.querySelector(".odo");
  odo.style.setProperty("--n", digits);
  odo.setAttribute("aria-label", `${str("label", "Count")}: ${Number.isFinite(v) ? fmt(v, 0) : "no reading"} ${str("unit")}`);
  const reels = [];
  [...shown].forEach((ch, i) => {
    if (i && (digits - i) % 3 === 0 && digits > 4) odo.append(el("span", "sep", ","));
    const drum = el("span", "drum");
    const reel = el("span", "reel");
    reel.style.setProperty("--i", digits - 1 - i);
    if (ch === "–") reel.append(el("span", "", "–"));
    else for (let d = 0; d <= 9; d++) reel.append(el("span", "", String(d)));
    drum.append(reel);
    odo.append(drum);
    reels.push([reel, ch]);
  });
  document.querySelector(".unit").textContent = [str("unit"), str("note")].filter(Boolean).join(" · ");
  settle(() => reels.forEach(([r, ch]) => ch !== "–" && r.style.setProperty("--d", ch)));
  caption("Count", s);
</script>
</body>
</html>
