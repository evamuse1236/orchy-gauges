<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time clock</title>
<link rel="stylesheet" href="gauge.css?v=3">
<style>
  .inst { grid-template-columns: auto minmax(0, 1fr); gap: clamp(10px, 5cqw, 24px); justify-items: start; align-items: center; }
  .inst > svg { inline-size: auto; block-size: min(100cqh, 46cqw); aspect-ratio: 1; }
  .ring { stroke: var(--dim); }
  .sweep { stroke: var(--ink); filter: drop-shadow(0 0 4px var(--glow)); }
  .tick { stroke: var(--muted); }
  .hand { stroke: var(--fg); stroke-linecap: round; }
  .hub { fill: var(--ink); }
  .txt { min-inline-size: 0; display: grid; gap: 0.25em; }
  .big { font-size: clamp(22px, min(22cqh, 11cqw), 52px); font-weight: 650; line-height: 1.05; }
  :root[data-state="look"] .big, :root[data-state="broken"] .big { color: var(--ink); text-shadow: 0 0 10px var(--glow); }
  .sub { color: var(--muted); font-size: clamp(12px, min(9cqh, 4.4cqw), 16px); }
  @media (prefers-reduced-motion: no-preference) {
    .sweep { transition: stroke-dashoffset 1000ms cubic-bezier(0.22, 1, 0.36, 1); }
  }
</style>
</head>
<body>
<main class="panel">
  <div class="inst"><div class="txt"><span class="big"></span><span class="sub"></span><span class="sub lim"></span></div></div>
  <footer class="cap"></footer>
</main>
<script src="gauge.js?v=3"></script>
<script>
  const { num, str, when, span, svg, caption, settle, state } = G;
  const since = when(str("since")), until = when(str("until"));
  const limitH = num("limit");
  const limit = Number.isFinite(limitH) ? limitH * 3600000 : NaN;
  const counting = until ? "until" : "since";

  const g = svg("svg", { viewBox: "0 0 100 100", role: "img" });
  svg("circle", { cx: 50, cy: 50, r: 42, class: "ring", fill: "none", "stroke-width": 7 }, g);
  const sweep = svg("circle", { cx: 50, cy: 50, r: 42, class: "sweep", fill: "none", "stroke-width": 7, "stroke-linecap": "round", pathLength: 100, "stroke-dasharray": "100 200", transform: "rotate(-90 50 50)" }, g);
  sweep.style.strokeDashoffset = 100;
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    svg("line", { x1: 50 + 31 * Math.sin(a), y1: 50 - 31 * Math.cos(a), x2: 50 + 35 * Math.sin(a), y2: 50 - 35 * Math.cos(a), class: "tick", "stroke-width": i % 3 ? 1 : 2 }, g);
  }
  const hand = svg("line", { x1: 50, y1: 50, x2: 50, y2: 24, class: "hand", "stroke-width": 3 }, g);
  svg("circle", { cx: 50, cy: 50, r: 4, class: "hub" }, g);
  document.querySelector(".inst").prepend(g);

  const big = document.querySelector(".big"), sub = document.querySelector(".sub"), lim = document.querySelector(".lim");
  function draw() {
    const t = until || since;
    if (!t) {
      big.textContent = "–";
      sub.textContent = "no time given";
      state("unknown");
      caption(counting === "until" ? "Time left" : "Time since", "unknown");
      return;
    }
    const ms = counting === "until" ? t - Date.now() : Date.now() - t;
    let auto = null, share = NaN;
    if (Number.isFinite(limit)) {
      if (counting === "since") {
        share = ms / limit;
        auto = ms > 2 * limit ? "broken" : ms > limit ? "look" : "fine";
      } else {
        share = 1 - ms / limit;
        auto = ms <= 0 ? "broken" : ms < limit * 0.25 ? "look" : "fine";
      }
      lim.textContent = counting === "since" ? `limit ${span(limit)}` : `window ${span(limit)}`;
    }
    const s = state(auto);
    if (counting === "until" && ms <= 0) { big.textContent = span(ms); sub.textContent = "overdue"; }
    else { big.textContent = span(ms); sub.textContent = str("note", counting === "since" ? "since last run" : "left"); }
    const minutes = Math.abs(ms) / 60000;
    hand.setAttribute("transform", `rotate(${(minutes % 60) * 6} 50 50)`);
    const frac = Number.isFinite(share) ? Math.min(1, Math.max(0, share)) : (minutes % 60) / 60;
    settle(() => { sweep.style.strokeDashoffset = 100 - frac * 100; });
    g.setAttribute("aria-label", `${str("label", "Time")}: ${big.textContent} ${sub.textContent}`);
    caption(counting === "until" ? "Time left" : "Time since", s);
  }
  draw();
  setInterval(draw, 30000);
</script>
</body>
</html>
