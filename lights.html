<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status lights</title>
<link rel="stylesheet" href="gauge.css?v=3">
<style>
  .inst { place-items: stretch; overflow: clip; }
  .grid {
    display: grid; gap: clamp(6px, 2.4cqw, 12px);
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5em), 1fr));
    font-size: clamp(12px, min(4.2cqw, 9cqh), 16px);
  }
  .lamp {
    --c: var(--unknown);
    display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 0.6em;
    padding-block: 0.3em;
    min-inline-size: 0;
  }
  .lamp[data-s="fine"] { --c: var(--fine); }
  .lamp[data-s="look"] { --c: var(--look); }
  .lamp[data-s="broken"] { --c: var(--broken); }
  .bulb {
    grid-row: span 2; inline-size: 1.15em; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in oklch, var(--c) 40%, white), var(--c) 55%, color-mix(in oklch, var(--c) 60%, black));
    box-shadow: 0 0 0.7em color-mix(in oklch, var(--c) calc(var(--glow-mix) * 1.75), transparent);
  }
  .lamp[data-s="unknown"] .bulb { background: transparent; box-shadow: inset 0 0 0 2px var(--unknown); }
  .name { font-weight: 600; overflow: clip; text-overflow: ellipsis; white-space: nowrap; }
  .word { color: var(--c); font-size: 0.85em; }
  .lamp[data-s="unknown"] .word { color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .lamp[data-s="broken"] .bulb { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 1.4em var(--c); } }
  }
</style>
</head>
<body>
<main class="panel"><div class="inst"><div class="grid" role="list"></div></div><footer class="cap"></footer></main>
<script src="gauge.js?v=3"></script>
<script>
  const { str, state, el, caption, WORDS, RANK } = G;
  const items = str("lights", "No lights set:unknown").split(",").map(x => {
    const i = x.lastIndexOf(":");
    const name = (i > 0 ? x.slice(0, i) : x).trim();
    const s = (i > 0 ? x.slice(i + 1) : "").trim().toLowerCase();
    return [name, WORDS[s] ? s : "unknown"];
  }).filter(([n]) => n);

  const grid = document.querySelector(".grid");
  for (const [name, s] of items) {
    const lamp = el("div", "lamp");
    lamp.dataset.s = s;
    lamp.setAttribute("role", "listitem");
    lamp.append(el("span", "bulb"), el("span", "name", name), el("span", "word", WORDS[s]));
    lamp.title = `${name}: ${WORDS[s]}`;
    grid.append(lamp);
  }
  const worst = items.reduce((w, [, s]) => RANK[s] > RANK[w] ? s : w, "fine");
  const s = state(worst);
  const bad = items.filter(([, x]) => x === "look" || x === "broken").length;
  caption("Status", s, bad ? `${bad} of ${items.length} need you` : items.every(([, x]) => x === "fine") ? "All fine" : WORDS[s]);
</script>
</body>
</html>
