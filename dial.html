<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dial gauge</title>
<link rel="stylesheet" href="gauge.css">
<style>
  .needle { transform-box: view-box; transform-origin: 100px 100px; }
  .needle line { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--glow)); }
  .hub { fill: var(--face); stroke: var(--ink); stroke-width: 2.5; }
  .num { font-size: 30px; font-weight: 650; fill: var(--fg); }
  :root[data-state="look"] .num, :root[data-state="broken"] .num { fill: var(--ink); filter: drop-shadow(0 0 4px var(--glow)); }
  .unit { font-size: 13px; fill: var(--muted); }
  .tl { font-size: 10.5px; fill: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .needle { transition: transform 900ms cubic-bezier(0.2, 1.3, 0.4, 1); }
  }
</style>
</head>
<body>
<main class="panel"><div class="inst"></div><footer class="cap"></footer></main>
<script src="gauge.js"></script>
<script>
  const { num, str, judge, state, svg, caption, settle, fmt } = G;
  const min = num("min", 0), max = num("max", 100), v = num("value");
  const s = state(judge(v));
  const A0 = -125, A1 = 125, cx = 100, cy = 100, r = 84;
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const ang = x => A0 + (A1 - A0) * clamp01((x - min) / ((max - min) || 1));
  const pt = (a, rr) => [cx + rr * Math.sin(a * Math.PI / 180), cy - rr * Math.cos(a * Math.PI / 180)];
  const arc = (a, b, rr) => {
    const [x0, y0] = pt(a, rr), [x1, y1] = pt(b, rr);
    return `M${x0} ${y0}A${rr} ${rr} 0 ${b - a > 180 ? 1 : 0} 1 ${x1} ${y1}`;
  };

  const g = svg("svg", { viewBox: "0 10 200 162", role: "img" });
  const label = str("label", "Reading");
  g.setAttribute("aria-label", `${label}: ${Number.isFinite(v) ? fmt(v) : "no reading"} ${str("unit")}`);

  svg("path", { d: arc(A0, A1, r + 5), fill: "none", stroke: "var(--dim)", "stroke-width": 2 }, g);
  const look = num("look"), broken = num("broken"), low = str("good", "high") === "low";
  const zone = (a, b, color) => Number.isFinite(a) && Number.isFinite(b) && b > a &&
    svg("path", { d: arc(ang(a), ang(b), r + 5), fill: "none", stroke: color, "stroke-width": 4, opacity: 0.85 }, g);
  if (low) {
    zone(Number.isFinite(look) ? look : broken, Number.isFinite(broken) ? broken : max, "var(--look)");
    zone(broken, max, "var(--broken)");
  } else {
    zone(Number.isFinite(broken) ? broken : min, Number.isFinite(look) ? look : min, "var(--look)");
    zone(min, broken, "var(--broken)");
  }

  const ticks = svg("g", { class: "ticks", "stroke-linecap": "round" }, g);
  const majors = Math.round(num("ticks", 5));
  for (let i = 0; i <= majors * 5; i++) {
    const a = A0 + (A1 - A0) * i / (majors * 5), major = i % 5 === 0;
    const [x0, y0] = pt(a, r), [x1, y1] = pt(a, r - (major ? 11 : 5));
    svg("line", { x1: x0, y1: y0, x2: x1, y2: y1, "stroke-width": major ? 2.2 : 1, opacity: major ? 1 : 0.6 }, ticks);
    if (major) {
      const [tx, ty] = pt(a, r - 23);
      const t = svg("text", { x: tx, y: ty + 3.5, "text-anchor": "middle", class: "tl" }, g);
      t.textContent = fmt(min + (max - min) * i / (majors * 5), 0);
    }
  }

  const n = svg("text", { x: cx, y: 146, "text-anchor": "middle", class: "num" }, g);
  n.textContent = Number.isFinite(v) ? fmt(v) : "–";
  const u = svg("text", { x: cx, y: 164, "text-anchor": "middle", class: "unit" }, g);
  u.textContent = str("unit");

  const needle = svg("g", { class: "needle" }, g);
  needle.style.transform = `rotate(${A0}deg)`;
  svg("line", { x1: cx, y1: cy + 12, x2: cx, y2: cy - r + 14 }, needle);
  svg("circle", { cx, cy, r: 6, class: "hub" }, g);

  document.querySelector(".inst").append(g);
  if (Number.isFinite(v)) settle(() => { needle.style.transform = `rotate(${ang(v)}deg)`; });
  caption("Reading", s);
</script>
</body>
</html>
